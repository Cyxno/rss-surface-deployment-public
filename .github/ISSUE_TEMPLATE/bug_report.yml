name: Bug report / defect
description: Report a defect in the repository, the tools, or a failed deployment
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Deployment (RSS-Deploy / WinPE)
        - Media build (Update-RSSMedia)
        - Validation (Validate-RSSMedia / Pester)
        - Manifest (config/sources.json)
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Surface profile (if applicable)
      options: ["n/a", "SF4", "SF5", "SF6", "SF7", "SF8", "unknown / unsupported"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened (symptom)?
      description: Include the exact error message from the red screen or the tool output
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant portion of RSS-ADK-Deploy.log or RSS-Media-Validation.txt — no serial numbers or other device data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected?
    validations:
      required: true
